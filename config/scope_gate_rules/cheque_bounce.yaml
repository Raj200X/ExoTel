# Cheque Bounce / NI Act §138 — Scope Gate Rules
#
# Domain: cheque_bounce
# Statute: Negotiable Instruments Act 1881, §138-§142
# Jurisdiction: Central (uniform across India)
#
# Key facts expected in triage_fact.key_facts:
#   cheque_amount: float | null
#   cheque_date: str | null
#   bounce_date: str | null
#   return_reason: str | null         # e.g., "insufficient funds", "account closed"
#   notice_sent: bool | null          # whether §138 demand notice was sent
#   notice_date: str | null
#   notice_period_expired: bool | null # 15 days since notice
#   payee_or_drawer: str | null       # "payee" (receiver) or "drawer" (writer)
#   underlying_debt: str | null       # what the cheque was for
#   fraud_context: bool | null        # broader fraud/conspiracy indicators
#   multiple_cheques: bool | null
#   complaint_filed: bool | null
#   limitation_expired: bool | null   # >30 days from notice period expiry

domain: cheque_bounce

rules:
  # ===== HARD STOPS (priority 1-19) =====

  - id: CB_HARD_001
    description: "Fraud or criminal conspiracy context detected. Beyond §138 — criminal matter."
    condition: "key_facts.get('fraud_context') == True"
    action: hard_stop
    routing: criminal_lawyer
    priority: 1

  - id: CB_HARD_002
    description: "Caller is the accused in a §138 case. Needs defense lawyer, not triage."
    condition: "key_facts.get('is_accused') == True"
    action: hard_stop
    routing: criminal_lawyer
    priority: 2

  - id: CB_HARD_003
    description: "Cheque amount extremely high (>₹1 crore). Specialist litigation needed."
    condition: "key_facts.get('cheque_amount') is not None and key_facts.get('cheque_amount') > 10000000"
    action: hard_stop
    routing: generic_lawyer
    priority: 3

  # ===== CLARIFY (priority 20-49) =====

  - id: CB_CLARIFY_001
    description: "Payee/drawer role not established."
    condition: "key_facts.get('payee_or_drawer') is None"
    action: clarify
    clarification: "Just to understand your situation better — did you receive a cheque that bounced, or did someone file a complaint about a cheque you wrote?"
    missing_facts: ["payee_or_drawer"]
    priority: 20

  - id: CB_CLARIFY_002
    description: "Cheque amount not stated."
    condition: "key_facts.get('cheque_amount') is None"
    action: clarify
    clarification: "Could you tell me the amount on the cheque?"
    missing_facts: ["cheque_amount"]
    priority: 21

  - id: CB_CLARIFY_003
    description: "Return reason not known."
    condition: "key_facts.get('return_reason') is None"
    action: clarify
    clarification: "Do you know why the cheque bounced? For example, did the bank say 'insufficient funds' or 'account closed', or something else?"
    missing_facts: ["return_reason"]
    priority: 22

  - id: CB_CLARIFY_004
    description: "Notice status not established (critical for §138 procedure)."
    condition: "key_facts.get('payee_or_drawer') == 'payee' and key_facts.get('notice_sent') is None"
    action: clarify
    clarification: "Have you sent a legal notice to the person who wrote the cheque? Under Section 138, you need to send a demand notice within 30 days of the cheque bouncing."
    missing_facts: ["notice_sent"]
    priority: 23

  - id: CB_CLARIFY_005
    description: "Bounce date needed to check limitation period."
    condition: "key_facts.get('bounce_date') is None"
    action: clarify
    clarification: "When did the cheque bounce? The exact date or approximate month would help me guide you on timelines."
    missing_facts: ["bounce_date"]
    priority: 24

  # ===== SOFT STOPS (priority 50-79) =====

  - id: CB_SOFT_001
    description: "Limitation period may have expired. Filing deadline may have passed."
    condition: "key_facts.get('limitation_expired') == True"
    action: soft_stop
    routing: generic_lawyer
    priority: 50

  - id: CB_SOFT_002
    description: "Multiple cheques involved — complexity warrants lawyer review."
    condition: "key_facts.get('multiple_cheques') == True and key_facts.get('cheque_amount') is not None and key_facts.get('cheque_amount') > 500000"
    action: soft_stop
    routing: generic_lawyer
    priority: 51

  # ===== PROCEED — IN SCOPE (priority 80-99) =====

  # Payee path: hasn't sent notice yet — guide on notice procedure
  - id: CB_PROCEED_001
    description: "Payee hasn't sent §138 notice yet. Guide on notice procedure."
    condition: "key_facts.get('payee_or_drawer') == 'payee' and key_facts.get('notice_sent') == False"
    action: proceed
    priority: 80

  # Payee path: notice sent, waiting for 15-day period
  - id: CB_PROCEED_002
    description: "Payee sent notice, 15-day period not yet expired. Guide on next steps."
    condition: "key_facts.get('payee_or_drawer') == 'payee' and key_facts.get('notice_sent') == True and key_facts.get('notice_period_expired') == False"
    action: proceed
    priority: 81

  # Payee path: notice sent, 15 days expired, ready to file complaint
  - id: CB_PROCEED_003
    description: "Payee's notice period expired. Guide on filing §138 complaint in magistrate court."
    condition: "key_facts.get('payee_or_drawer') == 'payee' and key_facts.get('notice_sent') == True and key_facts.get('notice_period_expired') == True and key_facts.get('complaint_filed') != True"
    action: proceed
    priority: 82

  # Payee path: complaint already filed, asking about procedure
  - id: CB_PROCEED_004
    description: "Payee already filed complaint. Guide on court procedure and interim compensation."
    condition: "key_facts.get('payee_or_drawer') == 'payee' and key_facts.get('complaint_filed') == True"
    action: proceed
    priority: 83

  # Drawer path: received a notice, needs to understand implications
  - id: CB_PROCEED_005
    description: "Drawer received §138 notice. Guide on response options and implications."
    condition: "key_facts.get('payee_or_drawer') == 'drawer' and key_facts.get('is_accused') != True"
    action: proceed
    priority: 84

  # General understanding query — caller just wants to know about §138
  - id: CB_PROCEED_006
    description: "General understanding query about cheque bounce procedure."
    condition: "caller_intent == 'understand_rights' or caller_intent == 'process_guidance'"
    action: proceed
    priority: 90
